<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WritersNook Riso Ad</title>
<style>
  :root { --bg: #1b1a17; --fg: #ece5d6; --dim: #8d8676; --accent: #cf7853; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.2 ui-monospace, Consolas, monospace; overflow: hidden; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #stage { display: block; background: #F4EEE2; }
  #bar { display: flex; align-items: center; gap: 10px; width: min(92vw, 560px); }
  #bar button { background: none; border: 1px solid var(--dim); color: var(--fg); padding: 4px 10px; cursor: pointer; font: inherit; }
  #bar button:hover { border-color: var(--accent); }
  #scrub { position: relative; flex: 1; height: 22px; cursor: pointer; }
  #scrub .track { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: #3a3730; }
  #scrub .fill { position: absolute; left: 0; top: 10px; height: 2px; background: var(--accent); }
  #scrub .mark { position: absolute; top: 5px; width: 1px; height: 12px; background: var(--dim); }
  #time { min-width: 52px; text-align: right; color: var(--dim); }
  body.bare #bar { display: none; }
  body.bare #wrap { gap: 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="bar">
    <button id="play">play</button>
    <button id="replay">↺</button>
    <div id="scrub"><div class="track"></div><div class="fill"></div></div>
    <span id="time">0.00</span>
    <button id="rec" title="Real-time capture (quick preview)">rec</button>
    <button id="snd" title="Soundtrack on/off">sound off</button>
    <button id="mp4" title="Frame-exact MP4 with soundtrack, for upload">mp4</button>
  </div>
</div>
<script>
'use strict';
// ─────────────────────────────────────────────────────────────── constants
const W = 540, H = 960, CX = W / 2, CY = H / 2;
const DURATION = 15.0, FPS = 30, BEAT = 0.5;
const TAU = Math.PI * 2;
const params = new URLSearchParams(location.search);
const S = Math.max(0.5, Math.min(3, parseFloat(params.get('s') || '2')));
const BARE = params.get('ui') === '0';

const PAPER = '#F4EEE2';
const INKS = {
  //        colour     screen angle (deg)   base registration offset (logical px)
  ink:   { col: '#2E3192', ang: 45, off: [0, 0] },
  terra: { col: '#B25A38', ang: 15, off: [1.2, -0.6] },
  green: { col: '#4E7C6B', ang: 75, off: [-0.8, 0.9] },
  gold:  { col: '#E0A93B', ang: 0,  off: [0.6, 1.1] },
  blue:  { col: '#0078BF', ang: 30, off: [-1.0, -0.8] },
  sepia: { col: '#2A251D', ang: 60, off: [0.3, 0.2] }, // site ink #2a251d, for the brand close
};
const INK_NAMES = Object.keys(INKS);
const PITCH = 4.2; // halftone cell size in logical px

// ─────────────────────────────────────────────────────────────── math + rng
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const span = (t, a, b) => clamp((t - a) / (b - a));
const ease = {
  outCubic: u => 1 - Math.pow(1 - u, 3),
  inQuad: u => u * u,
  inOutCubic: u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  outBack: u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
};
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rngFor = key => mulberry32(hashStr(String(key)));

// Periodic wobble: a fixed sum of low harmonics, seeded once per key.
const wobbleCache = new Map();
function wobble(key) {
  let w = wobbleCache.get(key);
  if (!w) {
    const r = rngFor('wob:' + key);
    const terms = [2, 3, 4, 5, 7].map(k => ({ k, a: (0.4 + r()) / k, p: r() * TAU }));
    const norm = terms.reduce((s, x) => s + x.a, 0);
    w = th => terms.reduce((s, x) => s + x.a * Math.sin(x.k * th + x.p), 0) / norm;
    wobbleCache.set(key, w);
  }
  return w;
}

async function loadFonts() {
  await Promise.all(EMBEDDED_FONTS.map(async f => {
    const bin = Uint8Array.from(atob(f.data), c => c.charCodeAt(0));
    const face = new FontFace(f.family, bin, { weight: f.weight, style: f.style });
    await face.load();
    document.fonts.add(face);
  }));
}

const layerCanvas = {};
const L = {}; // ink name -> 2D context, pre-scaled to logical px
for (const name of INK_NAMES) {
  const c = document.createElement('canvas');
  c.width = Math.round(W * S); c.height = Math.round(H * S);
  layerCanvas[name] = c;
  L[name] = c.getContext('2d');
}
const cov = a => `rgba(0,0,0,${clamp(a)})`;
function clearLayers() {
  for (const n of INK_NAMES) {
    const g = L[n];

    g.setTransform(S, 0, 0, S, 0, 0);

}
const eachInk = fn => { for (const n of INK_NAMES) fn(L[n], n); };
// Remove a shape from the given inks (paper shows through).
function knock(names, pathFn) {

// ─────────────────────────────────────────────────────────────── drawing kit
// A hand-drawn ring: noisy radius, varying width, tapered open ends.
function ring(g, cx, cy, R, width, key, o = {}) {
  const gap = o.gap ?? 0.5, wob = wobble(key), wob2 = wobble(key + ':w');
  const a0 = (o.rot ?? 0) + (hashStr(key) % 1000) / 1000 * TAU;
  const amp = o.amp ?? 0.018;
  const n = Math.round(clamp(R * 0.7, 48, 420));
  const arc = TAU - gap;
  const taperU = o.taper ?? 0.14;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, th = a0 + gap / 2 + arc * u;
    const taper = Math.pow(clamp(Math.min(u, 1 - u) / taperU), 0.7);
    const r = R * (1 + amp * wob(th));
    const w = width * taper * (0.75 + 0.25 * (1 + wob2(th * 1.3)));
    pts.push([th, r, w]);
  }
  g.beginPath();
  for (const [th, r, w] of pts) g.lineTo(cx + Math.cos(th) * (r + w / 2), cy + Math.sin(th) * (r + w / 2));
  for (let i = pts.length - 1; i >= 0; i--) {
    const [th, r, w] = pts[i];
    g.lineTo(cx + Math.cos(th) * (r - w / 2), cy + Math.sin(th) * (r - w / 2));
  }
  g.fill();
}
// Wobbly filled circle (discs, moons, lamps).
function blob(g, cx, cy, R, key, amp = 0.02) {
  const wob = wobble(key), n = Math.round(clamp(R * 0.8, 32, 360));
  g.moveTo(cx + R * (1 + amp * wob(0)), cy);
  for (let i = 1; i < n; i++) {
    const th = (i / n) * TAU, r = R * (1 + amp * wob(th));
    g.lineTo(cx + Math.cos(th) * r, cy + Math.sin(th) * r);
  }
  g.closePath();
}
// Short tapered arc stroke (tick marks, sound arcs, water rings).
function arcStroke(g, cx, cy, R, a0, a1, width, key) {
  const wob = wobble(key), n = Math.max(8, Math.round(Math.abs(a1 - a0) * R / 3));
  const P = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, th = lerp(a0, a1, u);
    const w = width * Math.sin(Math.PI * u) ** 0.6;
    const r = R * (1 + 0.02 * wob(th * 3));
    P.push([th, r, w]);
  }
  g.beginPath();
  for (const [th, r, w] of P) g.lineTo(cx + Math.cos(th) * (r + w / 2), cy + Math.sin(th) * (r + w / 2));
  for (let i = P.length - 1; i >= 0; i--) { const [th, r, w] = P[i]; g.lineTo(cx + Math.cos(th) * (r - w / 2), cy + Math.sin(th) * (r - w / 2)); }
  g.fill();
}
// Wobbly polygon from a point list (silhouettes).
function poly(g, pts, key, amp = 0.8) {
  const r = rngFor('poly:' + key);
  pts.forEach(([x, y], i) => {
    const jx = (r() - 0.5) * amp, jy = (r() - 0.5) * amp;
    if (i === 0) g.moveTo(x + jx, y + jy); else g.lineTo(x + jx, y + jy);
  });
  g.closePath();
}

// ─────────────────────────────────────────────────────────────── caret + ripple
const CARET_W = 7, CARET_H = 46;
function caretPath(g, x, y, sc = 1) {
  const w = CARET_W * sc, h = CARET_H * sc, r = w / 2;
  g.moveTo(x - w / 2, y - h / 2 + r);
  g.arc(x, y - h / 2 + r, r, Math.PI, 0);
  g.lineTo(x + w / 2, y + h / 2 - r);
  g.arc(x, y + h / 2 - r, r, 0, Math.PI);
  g.closePath();
}
function drawCaret(x, y, alpha = 1, sc = 1, o = {}) {
  if (alpha <= 0) return;
  const inkName = o.ink ?? 'ink';
  // Paper halo so the caret reads over busy scenes.
  if (o.halo !== false) knock(INK_NAMES, g => caretPath(g, x, y, sc * 1.9));
  L[inkName].fillStyle = cov(alpha); L[inkName].beginPath(); caretPath(L[inkName], x, y, sc); L[inkName].fill();
  // Deliberate terracotta fringe: drawn a hair left of the ink bar.
  L.terra.fillStyle = cov(alpha); L.terra.beginPath(); caretPath(L.terra, x - 1.6 * sc, y + 0.8 * sc, sc); L.terra.fill();
}

const MAX_R = Math.hypot(CX, CY) + 40;
function drawRipple(localT, key, o = {}) {
  const dur = o.dur ?? 0.75;
  const u = localT / dur;
  if (u < 0 || u > 1) return;
  const g = L[o.ink ?? 'blue'];
  const R = lerp(o.r0 ?? 10, o.r1 ?? MAX_R, ease.outCubic(u));
  const width = lerp(o.w0 ?? 11, o.w1 ?? 2.2, ease.outCubic(u));
  const alpha = lerp(1, 0.35, u);
  g.fillStyle = cov(alpha);
  ring(g, CX, CY, R, width, key, { gap: 0.35 + 0.4 * u, amp: 0.025 });
  // Tick arcs flick near the rim once the ring is visible on screen.
  const tu = span(u, 0.25, 0.7);
  if (tu > 0 && tu < 1) {
    const r = rngFor('tick:' + key), base = r() * TAU;
    g.fillStyle = cov(1 - tu * 0.6);
    for (let k = 0; k < 3; k++) {
      const rr = R + 10 + k * 7, half = 0.09 + 0.02 * k;
      arcStroke(g, CX, CY, rr, base - half, base + half, 2.4, key + ':t' + k);
      arcStroke(g, CX, CY, rr, base + Math.PI - half, base + Math.PI + half, 2.4, key + ':u' + k);
    }
  }
}

// Shared night sky: solid blue with an indigo overprint ramp and gold stars.
function nightSky(key, bottom, o = {}) {

  const top = o.top ?? 0.85, rampEnd = o.rampEnd ?? 640;
  blue.fillStyle = cov(1); blue.fillRect(-20, -20, W + 40, bottom + 20);

// Diagonal rain streaks as a path (seeded positions, falling with t).
function rainPath(g, key, t, box, n = 140) {
  const r = rngFor(key);

    g.moveTo(x, y); g.lineTo(x + 1.6, y); g.lineTo(x + 1.6 - dx, y + len); g.lineTo(x - dx, y + len); g.closePath();
  }
}

function ellipseBand(g, cx, cy, rx, ry, thick, rot) {
  g.ellipse(cx, cy, rx, ry, rot, 0, TAU);
  g.ellipse(cx, cy, rx - thick, ry - thick * ry / rx, rot, 0, TAU, true);
}

// Snow / sparks: seeded round flecks drifting down with t.
function flecksPath(g, key, t, n, speed, box, size = [1.2, 3]) {
  const r = rngFor(key);
  const [x0, y0, x1, y1] = box, h = y1 - y0;
  for (let i = 0; i < n; i++) {
    const bx = x0 + r() * (x1 - x0), by = r() * h, z = lerp(size[0], size[1], r()), sway = r() * TAU;
    const y = y0 + ((by + t * speed * (0.6 + z / size[1])) % h);
    const x = bx + Math.sin(t * 2 + sway) * 6;
    g.moveTo(x + z, y); g.arc(x, y, z, 0, TAU);
  }
}

    const cabin = g => poly(g, [[CX - 120, 600], [CX + 120, 600], [CX + 120, 740], [CX - 120, 740]], 'cb:walls', 1);
    const roof = g => poly(g, [[CX - 160, 606], [CX, 430], [CX + 160, 606], [CX + 140, 616], [CX, 470], [CX - 140, 616]], 'cb:roof', 1.5);
    const gable = g => poly(g, [[CX - 130, 604], [CX, 466], [CX + 130, 604]], 'cb:gable', 1);
    knock(['blue', 'green', 'gold'], g => { cabin(g); gable(g); roof(g); });
    ink.fillStyle = cov(1); ink.beginPath(); cabin(ink); gable(ink); ink.fill();
    green.fillStyle = cov(0.6); green.beginPath(); cabin(green); green.fill();
    // Snow roof stays paper; give it a blue shade edge.
    blue.fillStyle = cov(0.45); blue.beginPath(); poly(blue, [[CX - 160, 606], [CX - 140, 616], [CX, 470], [CX, 452]], 'cb:roofshade', 0.6); blue.fill();
    // Log lines knocked out of the walls.
    knock(['ink', 'green'], g => { for (let i = 0; i < 6; i++) poly(g, [[CX - 118, 620 + i * 22], [CX + 118, 619 + i * 22], [CX + 118, 621.6 + i * 22], [CX - 118, 622.6 + i * 22]], 'cb:log' + i, 0.4); });
    // Chimney with smoke rings drifting up (live).
    ink.fillStyle = cov(1); ink.fillRect(CX + 70, 470, 24, 70);
    ink.fillStyle = cov(0.5);
    for (let k = 0; k < 4; k++) {
      const ph = (t * 0.7 + k / 4) % 1;
      arcStroke(ink, CX + 82 + Math.sin(ph * 5) * 10, 450 - ph * 200, 8 + ph * 18, Math.PI * 0.9, Math.PI * 2.1, 3.5 * (1 - ph) + 0.4, 'cb:smoke' + k);
    }
    // Window on the caret: gold with glow on the snow and light rings.
    const win = g => g.rect(CX - 26, WY - 30, 52, 60);
    knock(['ink', 'green'], win);
    gold.fillStyle = cov(1); gold.beginPath(); win(gold); gold.fill();
    ink.fillStyle = cov(1); ink.fillRect(CX - 26, WY - 1.5, 52, 3);
    const gr = gold.createRadialGradient(CX, 760, 10, CX, 760, 190);
    gr.addColorStop(0, cov(0.6)); gr.addColorStop(1, cov(0));
    gold.fillStyle = gr; gold.beginPath(); gold.ellipse(CX, 770, 200, 44, 0, 0, TAU); gold.fill();
    gold.fillStyle = cov(0.85);
    for (let k = 0; k < 2; k++) {
      const R = 50 + k * 18 + ((t * 20) % 18);
      for (const n of ['blue', 'ink', 'green']) { const g = L[n]; g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; arcStroke(g, CX, WY, R, -2.5, -0.64, 2.4, 'cb:glow' + k); g.restore(); }
      arcStroke(gold, CX, WY, R, -2.5, -0.64, 2.4, 'cb:glow' + k);
    }
    // Door.
    gold.fillStyle = cov(0.35); gold.fillRect(CX - 90, 650, 34, 90);
    // Near pines framing the cabin.
    knock(['blue', 'gold'], g => near.forEach(p => pine(g, ...p)));
    green.fillStyle = cov(1); green.beginPath(); near.forEach(p => pine(green, ...p)); green.fill();
    ink.fillStyle = cov(0.55); ink.beginPath(); near.forEach(p => pine(ink, ...p)); ink.fill();
    eachInk(g => g.restore());
    // Falling snow.
    knock(['green', 'ink', 'blue'], g => flecksPath(g, 'cb:snow', t, 90, 60, [-20, -20, W + 20, H + 20], [1.2, 3.2]));
  },
};

// ─────────────────────────────────────────────────────────────── scene cache (medallions + cards)
// Each scene is rendered once, frozen, into per-ink bitmaps of the region around the caret,
// plus a single-blue version derived from its print darkness (the "ink drain").
const CACHE_HR = 210;
const DARKNESS = { ink: 0.9, terra: 0.6, green: 0.6, gold: 0.3, blue: 0.6, sepia: 0.95 };
const sceneCache = new Map();
function getCache(id) {
  let c = sceneCache.get(id);
  if (c) return c;
  const k = S * 0.7, size = Math.round(CACHE_HR * 2 * k);
  const saved = {};
  c = { ink: {}, blue: null };
  for (const n of INK_NAMES) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.setTransform(k, 0, 0, k, -(CX - CACHE_HR) * k, -(CY - CACHE_HR) * k);
    saved[n] = L[n]; L[n] = g; c.ink[n] = cv;
  }
  try { SCENES[id].draw(0.4); } finally { for (const n of INK_NAMES) L[n] = saved[n]; }
  const data = INK_NAMES.map(n => c.ink[n].getContext('2d').getImageData(0, 0, size, size).data);
  const bcv = document.createElement('canvas');
  bcv.width = bcv.height = size;
  const bg = bcv.getContext('2d'), out = bg.createImageData(size, size);
  const w = INK_NAMES.map(n => DARKNESS[n]);
  for (let p = 3; p < out.data.length; p += 4) {
    let light = 1;
    for (let i = 0; i < data.length; i++) light *= 1 - (data[i][p] / 255) * w[i];
    out.data[p] = Math.round(clamp((1 - light) * 1.25) * 255);
  }
  bg.putImageData(out, 0, 0);
  c.blue = bcv;
  sceneCache.set(id, c);
  return c;
}

const ARCHIVE = ['lighthouse', 'detective', 'dragon', 'planet', 'cafe', 'castle', 'ship', 'cabin'];
const TAB_INK = ['terra', 'green', 'gold', 'terra', 'green', 'gold', 'terra', 'green'];

// One scene as a medallion morphing into an index card.
// q: 0 = circle medallion, 1 = card with tab, scribbles and pin. colour: 1 = full inks, 0 = single blue.
function drawCard(id, i, o) {
  const { x, y, w, h, rad, img, imgDy = 0, colour = 1, q = 0 } = o;
  if (w < 1 || h < 1) return;
  const c = getCache(id);
  const shape = g => { g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, Math.min(rad, w / 2, h / 2)); };
  for (const n of INK_NAMES) { const g = L[n]; g.save(); g.globalCompositeOperation = 'destination-out'; shape(g); g.fill(); g.restore(); }
  const d = CACHE_HR * 2 * img;
  const imgH = lerp(h, h * 0.6, q);
  for (const n of INK_NAMES) {
    const g = L[n];
    g.save(); shape(g); g.clip();
    g.beginPath(); g.rect(x - w / 2, y - h / 2, w, imgH); g.clip();
    if (colour > 0) { g.globalAlpha = colour; g.drawImage(c.ink[n], x - d / 2, y + imgDy - d / 2, d, d); }
    if (n === 'blue' && colour < 1) { g.globalAlpha = 1 - colour; g.drawImage(c.blue, x - d / 2, y + imgDy - d / 2, d, d); }
    g.restore();
  }
  const ink = L.ink;
  ink.save(); ink.fillStyle = cov(0.9); ink.lineWidth = 2.4; ink.strokeStyle = cov(0.9);
  shape(ink); ink.stroke(); ink.restore();
  if (q <= 0) return;
  // Card furniture fades in as the shape settles.
  const top = y - h / 2;
  const tab = L[TAB_INK[i]];
  tab.fillStyle = cov(q); tab.fillRect(x - w / 2 + 2, top + imgH - 1, w - 4, 7);
  ink.fillStyle = cov(0.75 * q);
  const lr = rngFor('card:lines' + i);
  for (let k = 0; k < 2; k++) {
    const ly = top + imgH + 16 + k * 13, len = (w - 34) * (k ? 0.5 + lr() * 0.2 : 0.8 + lr() * 0.15);
    ink.beginPath(); poly(ink, [[x - w / 2 + 14, ly], [x - w / 2 + 14 + len, ly - 0.8], [x - w / 2 + 14 + len, ly + 2], [x - w / 2 + 14, ly + 2.8]], 'card:l' + i + k, 0.5); ink.fill();
  }
  const pin = L[TAB_INK[(i + 1) % 8]];
  pin.fillStyle = cov(q); pin.beginPath(); blob(pin, x, top + 6, 6.5 * q, 'card:pin' + i, 0.05); pin.fill();
}

// ─────────────────────────────────────────────────────────────── Act III: archive
function archivePose(i, t) {
  const inner = i % 2 === 0;
  const rx = inner ? 136 : 196, ry = inner ? 196 : 322, R = inner ? 60 : 70;
  const dir = inner ? 1 : -1;
  const a = (i / 8) * TAU - Math.PI / 2 + dir * (t - 6.8) * 0.55;
  const sc = ease.inQuad(span(t, 7.7, 8.5));
  const out = 1 + 0.85 * sc;
  return { x: CX + Math.cos(a) * rx * out, y: CY + Math.sin(a) * ry * out, R: R * (1 - 0.45 * sc) };
}
function drawArchive(t) {
  // 6.5–6.8: the last montage scene irises closed around the caret.
  if (t < 6.8) {
    const R = lerp(MAX_R, CACHE_HR, ease.inOutCubic(span(t, 6.5, 6.8)));
    drawSceneClipped('cabin', t - 6.25, R);
    return;
  }
  const colour = 1 - span(t, 7.3, 7.8);
  ARCHIVE.forEach((id, i) => {
    const pose = archivePose(i, t);
    let { x, y, R } = pose;
    if (id === 'cabin') {
      // The frozen cabin shrinks from the centre onto its orbit slot.
      const u = ease.inOutCubic(span(t, 6.8, 7.15));
      x = lerp(CX, x, u); y = lerp(CY, y, u); R = lerp(CACHE_HR, R, u);
    } else {
      R *= ease.outBack(span(t, 6.8 + i * 0.04, 7.1 + i * 0.04));
    }
    if (R < 0.5) return;
    drawCard(id, i, { x, y, w: R * 2, h: R * 2, rad: R, img: R / CACHE_HR, colour });
  });
}

// ─────────────────────────────────────────────────────────────── Act IV: the binder
const CARD_W = 176, CARD_H = 112;
const SLOTS = [[165, 246], [375, 246], [165, 372], [375, 372], [165, 588], [375, 588], [165, 714], [375, 714]];
const PAGE = { x: CX, y: CY - 20, w: 330, h: 460 };

SCENES.cork = {
  inks: ['terra', 'gold', 'ink'],
  draw() {
    const { terra, gold, ink } = L;
    terra.fillStyle = cov(0.34); terra.fillRect(-20, -20, W + 40, H + 40);
    const r = rngFor('cork');
    terra.fillStyle = cov(0.85); terra.beginPath();
    for (let i = 0; i < 260; i++) blob(terra, r() * W, r() * H, 0.8 + r() * 2.2, 'ck' + i, 0.3);
    terra.fill();
    gold.fillStyle = cov(0.55); gold.fillRect(-20, -20, W + 40, H + 40);
  },
};

function drawPage(t) {
  const p = ease.outBack(span(t, 9.9, 10.25));
  if (p <= 0) return;
  const w = PAGE.w * p, h = PAGE.h * p, x0 = PAGE.x - w / 2, y0 = PAGE.y - h / 2;
  L.ink.fillStyle = cov(0.45);
  L.ink.beginPath(); L.ink.rect(x0 + 10, y0 + 12, w, h); L.ink.fill();
  knock(INK_NAMES, g => g.rect(x0, y0, w, h));
  L.ink.strokeStyle = cov(0.5); L.ink.lineWidth = 1.6; L.ink.strokeRect(x0, y0, w, h);
  if (p < 0.95) return;
  // Heading, then lines typing in top to bottom; the last line ends at the caret.
  const left = PAGE.x - PAGE.w / 2 + 34;
  const hu = span(t, 10.05, 10.15);
  L.terra.fillStyle = cov(1);
  if (hu > 0) { L.terra.beginPath(); poly(L.terra, [[left, CY - 212], [left + 120 * hu, CY - 213], [left + 120 * hu, CY - 204], [left, CY - 203]], 'page:head', 0.6); L.terra.fill(); }
  const lr = rngFor('page:lines');
  const n = 7;
  L.ink.fillStyle = cov(0.85);
  for (let i = 0; i < n; i++) {
    const last = i === n - 1;
    const full = last ? CX - 12 - left : 230 + lr() * 34;
    const u = span(t, 10.12 + i * 0.075, 10.12 + (i + 1) * 0.075);
    if (u <= 0) continue;
    const y = CY - 170 + i * 28 + (last ? 170 - 6 * 28 : 0);
    const len = full * u;
    L.ink.beginPath(); poly(L.ink, [[left, y - 2], [left + len, y - 3], [left + len, y + 2], [left, y + 3]], 'page:l' + i, 0.7); L.ink.fill();
  }
}

function drawBackup(t) {
  const cx = CX, cy = 150;
  const ringU = ease.outBack(span(t, 10.8, 11.05));
  if (ringU > 0) {
    knock(INK_NAMES, g => blob(g, cx, cy, 54 * ringU, 'bk:disc', 0.01));
    L.ink.fillStyle = cov(1); ring(L.ink, cx, cy, 54 * ringU, 3.6, 'bk:ring', { gap: 0.001, taper: 0.001, amp: 0.015 });
  }
  const g = ease.inOutCubic(span(t, 10.75, 11.15));
  if (g > 0) {
    const s = lerp(1, 0.13, g), x = lerp(PAGE.x, cx - 4, g), y = lerp(PAGE.y, cy + 2, g);
    const w = PAGE.w * s, h = PAGE.h * s;
    knock(['terra', 'gold', 'ink'], gg => gg.rect(x - w / 2, y - h / 2, w, h));
    L.blue.fillStyle = cov(lerp(0.3, 1, g)); L.blue.fillRect(x - w / 2, y - h / 2, w, h);
    L.ink.strokeStyle = cov(0.8); L.ink.lineWidth = lerp(1.5, 2.5, g); L.ink.strokeRect(x - w / 2, y - h / 2, w, h);
  }
  const tick = span(t, 11.1, 11.3);
  if (tick > 0) {
    const pts = [[cx + 10, cy + 20], [cx + 22, cy + 32], [cx + 44, cy + 6]];
    const seg = tick * 2;
    L.gold.fillStyle = cov(1); L.ink.fillStyle = cov(1);
    knock(['ink', 'blue', 'terra'], gg => blob(gg, cx + 26, cy + 20, 22, 'bk:badgek', 0.02));
    L.gold.beginPath(); blob(L.gold, cx + 26, cy + 20, 19, 'bk:badge', 0.02); L.gold.fill();
    L.ink.lineWidth = 5; L.ink.lineCap = 'round'; L.ink.lineJoin = 'round'; L.ink.strokeStyle = cov(1);
    L.ink.beginPath(); L.ink.moveTo(...pts[0]);
    const a = clamp(seg), b = clamp(seg - 1);
    L.ink.lineTo(lerp(pts[0][0], pts[1][0], a), lerp(pts[0][1], pts[1][1], a));
    if (b > 0) L.ink.lineTo(lerp(pts[1][0], pts[2][0], b), lerp(pts[1][1], pts[2][1], b));
    L.ink.stroke();
  }
}

function drawBinder(t) {
  const board = MAX_R * ease.inOutCubic(span(t, 8.5, 8.8));
  if (board > 0.5) drawSceneClipped('cork', 0, t >= 8.8 ? MAX_R : board);
  drawPage(t);
  ARCHIVE.forEach((id, i) => {
    const from = archivePose(i, 8.5);
    const u = ease.inOutCubic(span(t, 8.6 + i * 0.04, 9.2 + i * 0.04));
    const v = ease.inQuad(span(t, 9.7 + i * 0.03, 10.0 + i * 0.03));
    if (v >= 1) return;
    const [sx, sy] = SLOTS[i];
    const k = 1 - v;
    const x = lerp(lerp(from.x, sx, u), PAGE.x, v), y = lerp(lerp(from.y, sy, u), PAGE.y, v);
    const w = lerp(from.R * 2, CARD_W, u) * k, h = lerp(from.R * 2, CARD_H, u) * k;
    drawCard(id, i, {
      x, y, w, h, rad: lerp(from.R, 7, u) * k,
      img: lerp(from.R / CACHE_HR, 0.62, u) * k, imgDy: lerp(0, -18, u) * k,
      colour: span(t, 8.8 + i * 0.04, 9.2 + i * 0.04), q: span(u, 0.55, 1) * k,
    });
  });
  if (t >= 10.7) drawBackup(t);
}

// ─────────────────────────────────────────────────────────────── Act V: end card
// The brand close: the Writers Nook mark (quill + lit doorway) printed around the caret, so the
// caret ends the film as the light inside the nook. Wordmark and label use the site's own type.
const END_T0 = 11.5;
const LOGO_K = 1.3;                 // logo units → logical px
const LOGO_DOOR = [141, 176];       // door centre in logo units; lands on the caret
const lx = u => CX + (u - LOGO_DOOR[0]) * LOGO_K;
const ly = v => CY + (v - LOGO_DOOR[1]) * LOGO_K;
const LP = pts => pts.map(([u, v]) => [lx(u), ly(v)]);

function featherPath(g) {
  const P = (u, v) => [lx(u), ly(v)];
  const M = (u, v) => g.moveTo(...P(u, v));
  const Q = (cu, cv, u, v) => g.quadraticCurveTo(...P(cu, cv), ...P(u, v));
  const C = (au, av, bu, bv, u, v) => g.bezierCurveTo(...P(au, av), ...P(bu, bv), ...P(u, v));
  M(66, 226);
  C(78, 150, 118, 58, 216, 16);               // long left edge up to the tip
  Q(214, 50, 204, 70);                        // outer edge, top vane
  Q(186, 80, 168, 90);                        // first notch
  Q(196, 92, 208, 104);
  Q(204, 124, 194, 136);                      // second vane
  Q(186, 138, 178, 142);                      // second notch
  Q(194, 150, 196, 162);
  Q(196, 190, 192, 210);                      // hood side down to the base
  g.lineTo(...P(104, 210));
  Q(88, 212, 66, 226);                        // back along the quill shaft
  g.closePath();
}
function veinPath(g) {
  const pts = [];
  for (let i = 0; i <= 30; i++) {
    const u = i / 30;
    // Quadratic curve from the quill tip up toward the top of the feather.
    const x = (1 - u) * (1 - u) * 76 + 2 * u * (1 - u) * 104 + u * u * 202;
    const y = (1 - u) * (1 - u) * 214 + 2 * u * (1 - u) * 92 + u * u * 30;
    pts.push([x, y]);
  }
  const P = LP(pts), w = 2.3;
  g.moveTo(P[0][0] - w, P[0][1]);
  P.forEach(([x, y]) => g.lineTo(x - w, y));
  for (let i = P.length - 1; i >= 0; i--) g.lineTo(P[i][0] + w * (0.3 + 0.7 * (i / P.length)), P[i][1]);
  g.closePath();
}
function doorPath(g, grow = 1) {
  const cx = lx(141), r = 18 * LOGO_K * grow, top = ly(158), bottom = ly(208);
  g.moveTo(cx - r, bottom); g.lineTo(cx - r, top); g.arc(cx, top, r, Math.PI, 0); g.lineTo(cx + r, bottom); g.closePath();
}

function inkText(g, text, x, y, font, a, o = {}) {
  if (a <= 0) return;
  g.save();
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  if (o.spacing) g.letterSpacing = o.spacing;
  g.fillStyle = cov(a);
  g.fillText(text, x, y);
  g.restore();
}

function drawEndCard(t) {
  const lt = t - END_T0;
  const { sepia, terra, gold, blue } = L;
  const iris = MAX_R * ease.inOutCubic(span(lt, 0, 0.3));
  eachInk(g => { g.save(); if (lt < 0.3) { g.beginPath(); blob(g, CX, CY, iris, 'end:iris', 0.01); g.clip(); } });
  // Knock out whatever was under the iris (the binder page) so the card prints on clean paper.
  if (lt < 0.3) knock(INK_NAMES, g => blob(g, CX, CY, iris, 'end:iris', 0.01));

  // Warm lamplight: a gold dot-ramp pooling out of the doorway.
  let gr = gold.createRadialGradient(CX, CY, 20, CX, CY + 40, 520);
  gr.addColorStop(0, cov(0.8)); gr.addColorStop(0.3, cov(0.34)); gr.addColorStop(0.75, cov(0.06)); gr.addColorStop(1, cov(0));
  gold.fillStyle = gr; gold.fillRect(-20, -20, W + 40, H + 40);
  // Terracotta rings rolling out of the nook on the beat (the ripple, one last time).
  for (let k = 0; k < 4; k++) {
    const ph = ((lt + 0.35) / 2 + k / 4) % 1;
    const R = 150 + ph * 520;
    terra.fillStyle = cov(0.55 * (1 - ph));
    ring(terra, CX, CY, R, 5 * (1 - ph) + 1.2, 'end:ring' + k, { gap: 0.9, rot: k * 1.3, amp: 0.02 });
  }
  // Page border like a book's printed frame.
  terra.fillStyle = cov(0.9);
  const fr = 22;
  terra.beginPath(); terra.rect(fr, fr, W - fr * 2, H - fr * 2); terra.rect(fr + 3, fr + 3, W - fr * 2 - 6, H - fr * 2 - 6); terra.fill('evenodd');
  // Motes of light drifting up out of the door.
  const mr = rngFor('end:motes');
  gold.fillStyle = cov(1); gold.beginPath();
  for (let i = 0; i < 26; i++) {
    const sx = CX + (mr() - 0.5) * 300, speed = 30 + mr() * 50, ph = mr();
    const y = CY + 60 - ((lt * speed + ph * 520) % 520);
    const x = sx + Math.sin(lt * 1.5 + ph * 9) * 14, z = 1.2 + mr() * 2.2;
    blob(gold, x, y, z, 'mote' + i, 0.2);
  }
  gold.fill();

  // The mark: feather grows in, the doorway lights up, the steps set down one by one.
  const grow = ease.outBack(span(lt, 0.15, 0.55));
  if (grow > 0) {
    const tr = g => { g.save(); g.translate(CX, CY); g.scale(grow, grow); g.translate(-CX, -CY); };
    eachInk(tr);
    knock(['gold', 'terra', 'blue'], featherPath);
    sepia.fillStyle = cov(1); sepia.beginPath(); featherPath(sepia); sepia.fill();
    knock(['sepia'], veinPath);
    knock(['sepia'], g => doorPath(g, 1));
    const lit = span(lt, 0.45, 0.75);
    gold.fillStyle = cov(lerp(0.2, 1, lit)); gold.beginPath(); doorPath(gold, 1); gold.fill();
    terra.fillStyle = cov(1);
    for (let i = 0; i < 4; i++) {
      const s = ease.outBack(span(lt, 0.55 + i * 0.06, 0.8 + i * 0.06));
      if (s <= 0) continue;
      const w = (48 + i * 12) * LOGO_K * s, y = ly(211 + i * 7);
      knock(['gold'], g => g.rect(lx(141) - w / 2, y, w, 4.6 * LOGO_K));
      terra.beginPath(); poly(terra, [[lx(141) - w / 2, y], [lx(141) + w / 2, y], [lx(141) + w / 2, y + 4.4 * LOGO_K], [lx(141) - w / 2, y + 4.6 * LOGO_K]], 'end:step' + i, 0.4); terra.fill();
    }
    eachInk(g => g.restore());
  }

  // Wordmark, label and address: halftone "ink-up" — the dots grow in rather than fading.
  const base = ly(236) + 96;
  const wm = ease.outCubic(span(lt, 0.8, 1.2));
  // Keep the rings out from behind the type so it reads cleanly.
  knock(['terra'], g => g.rect(30, base - 70, W - 60, 150));
  inkText(sepia, 'Writers Nook', CX, base, '600 66px Literata', wm, { spacing: '-1.3px' });
  const lab = ease.outCubic(span(lt, 1.25, 1.55));

  const pill = ease.outBack(span(lt, 1.7, 2.0));
  if (pill > 0) {
    const pw = 292 * pill, ph = 58 * pill, py = base + 104;
    const pillPath = g => g.roundRect(CX - pw / 2, py - ph / 2, pw, ph, ph / 2);
    knock(['gold', 'terra', 'blue'], pillPath);

const CUES = [

const ACTS = [
  { t: 0.0, name: 'I' }, { t: 3.0, name: 'II' }, { t: 6.5, name: 'III' },
  { t: 8.5, name: 'IV' }, { t: 11.5, name: 'V' },

const active = t => CUES.filter(c => t >= c.start && (t < c.start + c.dur || (t >= DURATION && c.start + c.dur >= DURATION)));

let registration = {};
function setRegistration(sceneId) {
  registration = {};
  const reg = sceneId ? SCENES[sceneId].reg || {} : {};
  for (const n of INK_NAMES) registration[n] = reg[n] || INKS[n].off;
}

function drawSceneClipped(id, localT, R) {
  const full = R >= MAX_R;
  eachInk(g => { g.save(); if (!full) { g.beginPath(); blob(g, CX, CY, R, 'disc:' + id, 0.012); g.clip(); } });
  SCENES[id].draw(localT);
  eachInk(g => g.restore());
  if (!full) {
    L.ink.fillStyle = cov(1);
    ring(L.ink, CX, CY, R + 1.5, 3.2, 'discrim:' + id, { gap: 0.001, taper: 0.001, amp: 0.012 });
  }
}

function render(t) {
  clearLayers();
  const cues = active(t);
  const sceneCue = cues.find(c => c.kind === 'scene' || c.kind === 'disc');
  setRegistration(sceneCue ? sceneCue.scene : null);
  let caretSolid = false;
  for (const c of cues) {
    const lt = t - c.start;
    if (c.kind === 'disc') {
      const p = c.params;
      let R;
      if (p.iris) R = (MAX_R - 1) * ease.inOutCubic(span(lt, 0, c.dur));
      else {
        R = p.R * ease.outBack(span(lt, 0, p.open));
        const du = span(lt, p.open + p.hold, p.open + p.hold + p.dive);
        if (du > 0) R = lerp(p.R, MAX_R, ease.inOutCubic(du));
      }
      if (R > 0.5) drawSceneClipped(c.scene, lt, R);
      caretSolid = true;
    } else if (c.kind === 'endcard') {
      drawEndCard(t);
    } else if (c.kind === 'archive') {
      drawArchive(t); caretSolid = true;
    } else if (c.kind === 'binder') {
      drawBinder(t); caretSolid = true;
    } else if (c.kind === 'scene') {
      // Scene clock continues from the disc that opened it, so live elements don't pop.
      drawSceneClipped(c.scene, t - (c.params?.t0 ?? c.start), MAX_R);
      caretSolid = true;
    }
  }
  for (const c of cues) {
    if (c.kind === 'ripple') { drawRipple(t - c.start, c.params.key, c.params); caretSolid = true; }
  }
  const blinkOn = (Math.floor(t / BEAT) % 2) === 0;
  const [cx, cy] = caretPos(t);
  if (t >= END_T0) drawCaret(cx, cy, t < END_T0 + 1.2 || blinkOn ? 1 : 0, 1, { ink: 'sepia', halo: false });
  else drawCaret(cx, cy, caretSolid || blinkOn ? 1 : 0);
  composite();
}

// ─────────────────────────────────────────────────────────────── WebGL2 riso compositor
const stage = document.getElementById('stage');
stage.width = Math.round(W * S); stage.height = Math.round(H * S);
const gl = stage.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, premultipliedAlpha: false });
if (!gl) document.body.textContent = 'WebGL2 is required.';

const VS = `#version 300 es
in vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 uRes;      // device px
uniform float uS;       // device px per logical px
uniform vec3 uPaper;
uniform sampler2D uT0, uT1, uT2, uT3, uT4, uT5;
uniform vec3 uCol[6];
uniform float uAng[6];
uniform vec2 uOff[6];   // logical px
uniform float uPitch;   // logical px

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }

float coverage(int i, vec2 uv){
  if(i==0) return texture(uT0, uv).a;
  if(i==1) return texture(uT1, uv).a;
  if(i==2) return texture(uT2, uv).a;
  if(i==3) return texture(uT3, uv).a;
  if(i==4) return texture(uT4, uv).a;
  return texture(uT5, uv).a;
}

// Amplitude-modulated screen: dots grow until 50%, then paper holes shrink.
float screen(vec2 lp, float c, float ang, float pitch, float aa){
  if(c < 0.02) return 0.0;
  if(c > 0.96) return 1.0;
  float ca = cos(ang), sa = sin(ang);
  vec2 q = mat2(ca, -sa, sa, ca) * lp / pitch;
  if(c < 0.5){
    float d = length(fract(q) - 0.5);
    float r = sqrt(c / 3.14159);
    return 1.0 - smoothstep(r - aa, r + aa, d);
  }
  float dh = length(fract(q + 0.5) - 0.5);
  float rh = sqrt((1.0 - c) / 3.14159);
  return smoothstep(rh - aa, rh + aa, dh);
}

void main(){
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y); // top-left origin, device px
  vec2 lp = px / uS;                                         // logical px
  // Paper: static fibre grain and faint mottling.
  float mott = fbm(lp * 0.012) - 0.5;
  float fibre = vnoise(vec2(lp.x * 0.9, lp.y * 0.07)) - 0.5;
  float grit = hash(floor(lp * 1.5)) - 0.5;
  vec3 col = uPaper * (1.0 + mott * 0.045 + fibre * 0.02 + grit * 0.018);
  float aa = 0.75 / (uPitch * uS);
  for(int i = 0; i < 6; i++){
    vec2 slp = lp - uOff[i];
    float c = coverage(i, slp * uS / uRes);
    if(c < 0.01) continue;
    float k = screen(slp, c, uAng[i], uPitch, aa);
    // Ink density: mottled, with small ink-starved voids in solids.
    float dens = 0.9 + 0.1 * fbm(slp * 0.05 + float(i) * 17.0);
    float voids = smoothstep(0.72, 0.8, fbm(slp * 0.09 + float(i) * 31.0));
    dens *= 1.0 - voids * 0.55;
    col *= mix(vec3(1.0), uCol[i], k * dens);
  }
  // Static speckle flecks.
  vec2 fc = lp * 0.9;
  float fleck = step(0.9985, hash(floor(fc) + 7.0)) * (1.0 - smoothstep(0.18, 0.34, length(fract(fc) - 0.5)));
  col *= mix(vec3(1.0), uCol[0], fleck * 0.55);
  outColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

const textures = INK_NAMES.map((name, i) => {
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + i);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U('uT' + i), i);
  return tex;
});
gl.uniform2f(U('uRes'), stage.width, stage.height);
gl.uniform1f(U('uS'), S);
gl.uniform3fv(U('uPaper'), hexRgb(PAPER));
gl.uniform1f(U('uPitch'), PITCH);
gl.uniform3fv(U('uCol'), INK_NAMES.flatMap(n => hexRgb(INKS[n].col)));
gl.uniform1fv(U('uAng'), INK_NAMES.map(n => INKS[n].ang * Math.PI / 180));
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);

function composite() {
  INK_NAMES.forEach((n, i) => {
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, textures[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, layerCanvas[n]);
  });
  gl.uniform2fv(U('uOff'), INK_NAMES.flatMap(n => registration[n]));
  gl.viewport(0, 0, stage.width, stage.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ─────────────────────────────────────────────────────────────── soundtrack
// Synthesized offline (OfflineAudioContext), so it is deterministic and sample-aligned with the
// frames. F major at 120 BPM; every cue below sits on a visual event in the timeline.
const SR = 48000;
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
const N = { F1: 29, Bb1: 34, C2: 36, D2: 38, F2: 41, G2: 43, A2: 45, Bb2: 46, C3: 48, D3: 50, E3: 52, F3: 53, G3: 55, A3: 57, Bb3: 58, C4: 60, D4: 62, E4: 64, F4: 65, G4: 67, A4: 69, C5: 72, D5: 74, E5: 76, F5: 77, G5: 79, A5: 81, C6: 84, E6: 88, F6: 89 };

const CHORDS = [
  { t: 0.0, dur: 2.0, bass: N.F2, notes: [N.A3, N.C4, N.E4, N.G4] },   // Fmaj9 — the blank page
  { t: 2.0, dur: 2.0, bass: N.D2, notes: [N.F3, N.A3, N.C4, N.E4] },   // Dm9 — ideas answer
  { t: 4.0, dur: 2.5, bass: N.Bb1, notes: [N.D3, N.F3, N.A3, N.C4] },  // Bbmaj9
  { t: 6.5, dur: 2.0, bass: N.G2 - 12, notes: [N.Bb2, N.D3, N.F3, N.A3], dark: true }, // Gm9 — scattered
  { t: 8.5, dur: 2.0, bass: N.C2, notes: [N.F3, N.G3, N.C4, N.E4] },   // C(sus) — caught
  { t: 10.5, dur: 1.0, bass: N.A2 - 12, notes: [N.G3, N.C4, N.E4, N.A4] }, // Am7 — saved
  { t: 11.5, dur: 3.5, bass: N.F2 - 12, notes: [N.A3, N.C4, N.E4, N.G4, N.C5] }, // Fmaj9 — home
];
const ARP = [{ from: 3.0, to: 5.5, step: 0.25 }, { from: 5.5, to: 6.5, step: 0.125 }, { from: 8.75, to: 11.5, step: 0.25 }];
const CUTS = [3.0, 3.5, 4.0, 5.0, 5.5, 5.75, 6.0, 6.25, 6.5, 11.5];
const PINGS = [[0.25, N.C5], [1.25, N.A4], [4.5, N.C5], [8.5, N.F5]];

function renderSoundtrack() {
  const ctx = new OfflineAudioContext(2, Math.round(DURATION * SR), SR);
  const rng = rngFor('audio');
  // Reverb: seeded, decaying stereo noise impulse.
  const irLen = Math.round(SR * 2.6), ir = ctx.createBuffer(2, irLen, SR);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < irLen; i++) d[i] = (rng() * 2 - 1) * Math.pow(1 - i / irLen, 3.2);
  }
  // Mix-level story arc: quiet page, full montage, a dip as ideas scatter, lift for the binder and the close.
  const master = ctx.createGain();
  [[0, 0.45], [1.9, 0.5], [3.0, 0.95], [6.4, 1.0], [7.2, 0.5], [8.4, 0.42], [8.8, 0.85], [11.4, 0.9], [12.4, 1.0], [15.0, 0.55]]
    .forEach(([t, v], i) => (i === 0 ? master.gain.setValueAtTime(v, t) : master.gain.linearRampToValueAtTime(v, t)));
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.2;
  master.connect(comp); comp.connect(ctx.destination);
  const verb = ctx.createConvolver(); verb.buffer = ir;
  const verbOut = ctx.createGain(); verbOut.gain.value = 0.32;
  verb.connect(verbOut); verbOut.connect(master);
  const bus = (dry = 1, wet = 0.5) => {
    const g = ctx.createGain(), w = ctx.createGain();
    g.gain.value = dry; w.gain.value = wet;
    const input = ctx.createGain();
    input.connect(g); g.connect(master); input.connect(w); w.connect(verb);
    return input;
  };
  const padBus = bus(0.55, 0.7), pluckBus = bus(0.5, 0.45), percBus = bus(0.8, 0.12), bellBus = bus(0.45, 0.8);
  const noise = (() => { const b = ctx.createBuffer(1, SR, SR), d = b.getChannelData(0); for (let i = 0; i < SR; i++) d[i] = rng() * 2 - 1; return b; })();

  // Pad: detuned saws through a lowpass whose cutoff follows the story.
  const cutoff = t => (t < 2 ? 700 : t < 6.5 ? 1800 : t < 8.5 ? 420 : t < 11.5 ? 1500 : 1900);
  for (const c of CHORDS) {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.4;
    lp.frequency.setValueAtTime(cutoff(c.t), c.t);
    if (c.dark) { lp.frequency.setValueAtTime(1400, c.t); lp.frequency.exponentialRampToValueAtTime(380, c.t + 1.6); }
    const env = ctx.createGain();
    const peak = c.t >= 11.5 ? 0.05 : 0.035;
    env.gain.setValueAtTime(0.0001, c.t);
    env.gain.exponentialRampToValueAtTime(peak, c.t + (c.t === 0 ? 0.35 : 0.12));
    env.gain.setValueAtTime(peak, c.t + c.dur - 0.05);
    env.gain.exponentialRampToValueAtTime(0.0001, Math.min(DURATION, c.t + c.dur + 0.6));
    lp.connect(env); env.connect(padBus);
    for (const m of c.notes) for (const det of [-7, 6]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.value = midi(m); o.detune.value = det + (c.dark ? -18 : 0);
      if (c.dark) o.detune.linearRampToValueAtTime(-45, c.t + c.dur);
      o.connect(lp); o.start(c.t); o.stop(Math.min(DURATION, c.t + c.dur + 0.7));
    }
    const sub = ctx.createOscillator(), sg = ctx.createGain();
    sub.type = 'sine'; sub.frequency.value = midi(c.bass);
    sg.gain.setValueAtTime(0.0001, c.t); sg.gain.exponentialRampToValueAtTime(0.09, c.t + 0.08);
    sg.gain.setValueAtTime(0.09, c.t + c.dur - 0.05); sg.gain.exponentialRampToValueAtTime(0.0001, Math.min(DURATION, c.t + c.dur + 0.3));
    sub.connect(sg); sg.connect(master); sub.start(c.t); sub.stop(Math.min(DURATION, c.t + c.dur + 0.35));
  }

  const pluck = (t, m, vol = 0.11, decay = 0.28, bright = 3200, out = pluckBus) => {
    if (t >= DURATION) return;
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = midi(m); o2.frequency.value = midi(m) * 2;
    lp.type = 'lowpass'; lp.frequency.value = bright;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(out);
    o.start(t); o2.start(t); o.stop(t + decay + 0.05); o2.stop(t + decay + 0.05);
  };
  const bell = (t, m, vol = 0.12, decay = 1.6) => {
    for (const [ratio, amp] of [[1, 1], [2.76, 0.28], [5.4, 0.1]]) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = midi(m) * ratio;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * amp, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, Math.min(DURATION, t + decay / ratio));
      o.connect(g); g.connect(bellBus); o.start(t); o.stop(Math.min(DURATION, t + decay / ratio + 0.05));
    }
  };
  const noiseHit = (t, dur, vol, type, freq, q = 0.8, sweepTo) => {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.01, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(percBus); s.start(t, rng() * 0.5); s.stop(t + dur + 0.02);
  };
  const kick = t => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(g); g.connect(percBus); o.start(t); o.stop(t + 0.26);
  };
  const chordAt = t => CHORDS.filter(c => t >= c.t).pop();

  // Ripples ping; the montage gets an arpeggio, kick on the beat and a tick on every cut.
  for (const [t, m] of PINGS) bell(t, m, 0.12, 1.8);
  for (const a of ARP) {
    let i = 0;
    for (let t = a.from; t < a.to - 1e-6; t += a.step, i++) {
      const c = chordAt(t), tones = [...c.notes, ...c.notes.map(n => n + 12)];
      pluck(t, tones[(i * 3) % tones.length] + 12, a.step < 0.2 ? 0.075 : 0.09, a.step < 0.2 ? 0.16 : 0.26);
    }
    for (let t = Math.ceil(a.from / BEAT) * BEAT; t < a.to - 1e-6; t += BEAT) kick(t);
  }
  for (const t of CUTS) noiseHit(t, 0.035, 0.09, 'highpass', 6500);
  // Act III: the ideas slip away — a falling glide and an airy swell.
  const glide = ctx.createOscillator(), gg = ctx.createGain();
  glide.type = 'sine'; glide.frequency.setValueAtTime(midi(N.A5), 7.2); glide.frequency.exponentialRampToValueAtTime(midi(N.D4), 8.4);
  gg.gain.setValueAtTime(0.0001, 7.2); gg.gain.exponentialRampToValueAtTime(0.045, 7.4); gg.gain.exponentialRampToValueAtTime(0.0001, 8.45);
  glide.connect(gg); gg.connect(bellBus); glide.start(7.2); glide.stop(8.5);
  noiseHit(7.3, 1.1, 0.05, 'bandpass', 900, 0.6, 3000);
  // Act IV: cards pin down, lines type, the copy is saved.
  [N.C5, N.D5, N.F5, N.G5, N.A5, N.C6, N.D5, N.F5].forEach((m, i) => pluck(9.2 + i * 0.04, m, 0.07, 0.22, 5000));
  noiseHit(9.7, 0.4, 0.04, 'bandpass', 2400, 0.7, 700);
  for (let i = 0; i < 7; i++) for (let k = 0; k < 3; k++) noiseHit(10.12 + i * 0.075 + k * 0.022, 0.012, 0.06, 'bandpass', 3800 + (i * 311) % 900, 2);
  bell(10.65, N.A5, 0.1, 1.4); bell(10.66, N.E6, 0.05, 1.0);
  pluck(11.12, N.C6, 0.08, 0.3, 6000); pluck(11.22, N.F6, 0.08, 0.45, 6000);
  // Act V: whoosh into the card, a low bloom, then a bell as the name inks up.
  noiseHit(11.3, 0.32, 0.07, 'lowpass', 400, 0.5, 4000);
  bell(12.3, N.F5, 0.1, 2.4); bell(12.32, N.A5, 0.07, 2.2); bell(12.34, N.C6, 0.05, 2.0);
  pluck(13.2, N.C5, 0.08, 0.5, 3000); pluck(13.33, N.F5, 0.07, 0.6, 3000);

  return ctx.startRendering().then(buf => {
    // Normalise to -1 dBFS and short fades at both ends so a platform loop never clicks.
    let peak = 0;
    for (let ch = 0; ch < buf.numberOfChannels; ch++) for (const v of buf.getChannelData(ch)) peak = Math.max(peak, Math.abs(v));
    const gain = peak > 0 ? 0.89 / peak : 1, fade = Math.round(0.02 * SR);
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < d.length; i++) {
        const e = Math.min(1, i / fade, (d.length - 1 - i) / fade);
        d[i] *= gain * e;
      }
    }
    return buf;
  });
}

let soundtrack = null, audioCtx = null, audioSrc = null, soundOn = false;
function stopSound() { if (audioSrc) { try { audioSrc.stop(); } catch { /* already stopped */ } audioSrc = null; } }
function startSound(at) {
  stopSound();
  if (!soundOn || !soundtrack || at >= DURATION) return;
  audioCtx = audioCtx || new AudioContext({ sampleRate: SR });
  audioSrc = audioCtx.createBufferSource();
  audioSrc.buffer = soundtrack; audioSrc.connect(audioCtx.destination);
  audioSrc.start(0, at);
}

// ─────────────────────────────────────────────────────────────── deterministic MP4 export
// Frame-by-frame: render(t) → VideoFrame with an exact timestamp → WebCodecs H.264 → a minimal
// MP4 (one video track, one chunk). Nothing depends on wall-clock speed, so no dropped frames.
function mp4Box(type, ...parts) {
  const size = 8 + parts.reduce((s, p) => s + p.length, 0);
  const out = new Uint8Array(size), dv = new DataView(out.buffer);
  dv.setUint32(0, size);
  for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  let o = 8;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
function mp4Bytes(spec) { // spec: [[bits, value], ...] or strings
  const len = spec.reduce((s, [b, v]) => s + (b === 's' ? v.length : b / 8), 0);
  const out = new Uint8Array(len), dv = new DataView(out.buffer);
  let o = 0;
  for (const [b, v] of spec) {
    if (b === 's') { for (let i = 0; i < v.length; i++) out[o + i] = v.charCodeAt(i); o += v.length; }
    else if (b === 8) dv.setUint8(o, v), (o += 1);
    else if (b === 16) dv.setUint16(o, v), (o += 2);
    else if (b === 32) dv.setUint32(o, v), (o += 4);
  }
  return out;
}
const MATRIX = [0x10000, 0, 0, 0, 0x10000, 0, 0, 0, 0x40000000].map(v => [32, v]);
const zeros = n => new Uint8Array(n);

function muxMp4({ width, height, fps, samples, avcC, audio }) {
  const fullBox = (type, ver, flags, ...parts) => mp4Box(type, mp4Bytes([[8, ver], [8, (flags >> 16) & 255], [16, flags & 0xffff]]), ...parts);
  const ftyp = mp4Box('ftyp', mp4Bytes([['s', 'isom'], [32, 0x200], ['s', 'isomiso2avc1mp41']]));
  const vLen = samples.reduce((s, x) => s + x.data.length, 0);
  const aLen = audio ? audio.samples.reduce((s, x) => s + x.data.length, 0) : 0;
  const mdatHeader = mp4Bytes([[32, vLen + aLen + 8], ['s', 'mdat']]);
  const vOffset = ftyp.length + mdatHeader.length, aOffset = vOffset + vLen;
  const durMs = Math.round((samples.length / fps) * 1000);
  const dinf = () => mp4Box('dinf', fullBox('dref', 0, 0, mp4Bytes([[32, 1]]), fullBox('url ', 0, 1)));
  const table = (n, sizes, delta, offset) => [
    fullBox('stts', 0, 0, mp4Bytes([[32, 1], [32, n], [32, delta]])),
    fullBox('stsc', 0, 0, mp4Bytes([[32, 1], [32, 1], [32, n], [32, 1]])),
    fullBox('stsz', 0, 0, mp4Bytes([[32, 0], [32, n], ...sizes.map(z => [32, z])])),
    fullBox('stco', 0, 0, mp4Bytes([[32, 1], [32, offset]])),
  ];
  const tkhd = (id, dur, isAudio) => fullBox('tkhd', 0, 3, mp4Bytes([[32, 0], [32, 0], [32, id], [32, 0], [32, dur], [32, 0], [32, 0], [16, 0], [16, 0], [16, isAudio ? 0x100 : 0], [16, 0], ...MATRIX, [32, isAudio ? 0 : width * 65536], [32, isAudio ? 0 : height * 65536]]));
  const mdhd = (ts, dur) => fullBox('mdhd', 0, 0, mp4Bytes([[32, 0], [32, 0], [32, ts], [32, dur], [16, 0x55c4], [16, 0]]));
  const hdlr = (type, name) => fullBox('hdlr', 0, 0, mp4Bytes([[32, 0], ['s', type], [32, 0], [32, 0], [32, 0], ['s', name + '\0']]));

  // Video.
  const n = samples.length, VTS = fps * 1000, VDELTA = 1000;
  const avc1 = mp4Box('avc1',
    mp4Bytes([[32, 0], [16, 0], [16, 1], [16, 0], [16, 0], [32, 0], [32, 0], [32, 0], [16, width], [16, height], [32, 0x480000], [32, 0x480000], [32, 0], [16, 1]]),
    zeros(32), mp4Bytes([[16, 0x18], [16, 0xffff]]), mp4Box('avcC', avcC));
  const keys = samples.map((x, i) => (x.key ? i + 1 : 0)).filter(Boolean);
  const [vstts, vstsc, vstsz, vstco] = table(n, samples.map(x => x.data.length), VDELTA, vOffset);
  const vstbl = mp4Box('stbl', fullBox('stsd', 0, 0, mp4Bytes([[32, 1]]), avc1), vstts,
    fullBox('stss', 0, 0, mp4Bytes([[32, keys.length], ...keys.map(k => [32, k])])), vstsc, vstsz, vstco);
  const vtrak = mp4Box('trak', tkhd(1, durMs, false),
    mp4Box('mdia', mdhd(VTS, n * VDELTA), hdlr('vide', 'VideoHandler'), mp4Box('minf', fullBox('vmhd', 0, 1, zeros(8)), dinf(), vstbl)));

  const traks = [vtrak];
  if (audio) {
    const an = audio.samples.length, asc = audio.asc;
    // esds: ES descriptor → decoder config (AAC, audio stream) → AudioSpecificConfig; SL config.
    const desc = (tag, body) => new Uint8Array([tag, body.length, ...body]);
    const decSpecific = desc(0x05, [...asc]);
    const decConfig = desc(0x04, [0x40, 0x15, 0, 0, 0, ...mp4Bytes([[32, 192000], [32, 192000]]), ...decSpecific]);
    const es = desc(0x03, [0, 1, 0, ...decConfig, ...desc(0x06, [0x02])]);
    const mp4a = mp4Box('mp4a',
      mp4Bytes([[32, 0], [16, 0], [16, 1], [16, 0], [16, 0], [32, 0], [16, audio.channels], [16, 16], [16, 0], [16, 0], [32, audio.sampleRate * 65536]]),
      fullBox('esds', 0, 0, es));
    const [astts, astsc, astsz, astco] = table(an, audio.samples.map(x => x.data.length), 1024, aOffset);
    const astbl = mp4Box('stbl', fullBox('stsd', 0, 0, mp4Bytes([[32, 1]]), mp4a), astts, astsc, astsz, astco);
    traks.push(mp4Box('trak', tkhd(2, Math.round((an * 1024 / audio.sampleRate) * 1000), true),
      mp4Box('mdia', mdhd(audio.sampleRate, an * 1024), hdlr('soun', 'SoundHandler'), mp4Box('minf', fullBox('smhd', 0, 0, zeros(4)), dinf(), astbl))));
  }
  const mvhd = fullBox('mvhd', 0, 0, mp4Bytes([[32, 0], [32, 0], [32, 1000], [32, durMs], [32, 0x10000], [16, 0x100], [16, 0], [32, 0], [32, 0], ...MATRIX, [32, 0], [32, 0], [32, 0], [32, 0], [32, 0], [32, 0], [32, traks.length + 1]]));
  const moov = mp4Box('moov', mvhd, ...traks);

}

async function encodeAac(buffer) {
  const config = { codec: 'mp4a.40.2', sampleRate: buffer.sampleRate, numberOfChannels: buffer.numberOfChannels, bitrate: 192000 };
  if (!(await AudioEncoder.isConfigSupported(config)).supported) throw new Error('AAC encoding is not supported in this browser');
  const out = [];
  let asc = null, error = null;
  const enc = new AudioEncoder({
    output(chunk, meta) {
      if (meta?.decoderConfig?.description && !asc) asc = new Uint8Array(meta.decoderConfig.description);
      const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
      out.push({ data });
    },
    error(e) { error = e; },
  });
  enc.configure(config);
  const ch = buffer.numberOfChannels, len = buffer.length, BLOCK = 4800;
  for (let o = 0; o < len; o += BLOCK) {
    const n = Math.min(BLOCK, len - o), planar = new Float32Array(n * ch);
    for (let c = 0; c < ch; c++) planar.set(buffer.getChannelData(c).subarray(o, o + n), c * n);
    const ad = new AudioData({ format: 'f32-planar', sampleRate: buffer.sampleRate, numberOfFrames: n, numberOfChannels: ch, timestamp: Math.round((o * 1e6) / buffer.sampleRate), data: planar });
    enc.encode(ad); ad.close();
  }
  await enc.flush(); enc.close();
  if (error) throw error;
  if (!asc) throw new Error('AAC encoder produced no AudioSpecificConfig');
  return { samples: out, asc, sampleRate: buffer.sampleRate, channels: ch };
}

async function exportMp4(onProgress = () => {}) {
  const width = stage.width, height = stage.height;
  const config = { codec: 'avc1.640033', width, height, bitrate: (parseFloat(params.get('mbps')) || 20) * 1e6, framerate: FPS, avc: { format: 'avc' }, latencyMode: 'quality' };
  const support = await VideoEncoder.isConfigSupported(config);
  if (!support.supported) throw new Error('H.264 encoding is not supported in this browser');
  const samples = [];
  let avcC = null, encodeError = null, lastTs = -1;
  const enc = new VideoEncoder({
    output(chunk, meta) {
      if (meta?.decoderConfig?.description && !avcC) avcC = new Uint8Array(meta.decoderConfig.description);
      if (chunk.timestamp <= lastTs) encodeError = new Error('encoder reordered frames (B-frames); muxer needs ctts');
      lastTs = chunk.timestamp;
      const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
      samples.push({ data, key: chunk.type === 'key' });
    },
    error(e) { encodeError = e; },
  });
  enc.configure(config);
  const frames = Math.round(DURATION * FPS);
  const grab = new OffscreenCanvas(width, height).getContext('2d');
  const wasPlaying = playing; playing = false;
  for (let f = 0; f < frames; f++) {
    // Hold the final end card for the last frame.
    render(Math.min(f / FPS, DURATION));
    // Defensive copy through a 2D canvas so the frame is read from the drawing buffer just rendered.
    grab.drawImage(stage, 0, 0);
    const vf = new VideoFrame(grab.canvas, { timestamp: Math.round((f * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(vf, { keyFrame: f % FPS === 0 });
    vf.close();
    if (enc.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 0));
    if (encodeError) throw encodeError;
    if (f % 15 === 0) onProgress(f / frames);
  }
  await enc.flush(); enc.close();
  if (encodeError) throw encodeError;
  if (!avcC) throw new Error('encoder produced no avcC description');
  onProgress(1);
  playing = wasPlaying; show();
  const audio = await encodeAac(soundtrack || (soundtrack = await renderSoundtrack()));
  return muxMp4({ width, height, fps: FPS, samples, avcC, audio });
}
window.__exportMp4 = exportMp4;

// ─────────────────────────────────────────────────────────────── player + controls
let now = clamp(parseFloat(params.get('t') || '0'), 0, DURATION);
let playing = false, lastWall = 0;
const $ = id => document.getElementById(id);
if (BARE) document.body.classList.add('bare');

function fit() {
  const availH = window.innerHeight - (BARE ? 0 : 60), availW = window.innerWidth - (BARE ? 0 : 24);
  const h = Math.min(availH, availW * H / W);
  stage.style.height = h + 'px'; stage.style.width = (h * W / H) + 'px';
}
window.addEventListener('resize', fit); fit();

for (const a of ACTS) {
  const m = document.createElement('div'); m.className = 'mark';
  m.style.left = (a.t / DURATION * 100) + '%'; m.title = 'Act ' + a.name;
  $('scrub').appendChild(m);
}
function show() {
  render(now);
  $('time').textContent = now.toFixed(2);
  document.querySelector('#scrub .fill').style.width = (now / DURATION * 100) + '%';
  $('play').textContent = playing ? 'pause' : 'play';
}
function tick(wall) {
  if (!playing) return;
  now += (wall - lastWall) / 1000; lastWall = wall;
  if (now >= DURATION) { now = DURATION; playing = false; onEnd(); }
  show();
  if (playing) requestAnimationFrame(tick);
}
function play() {
  if (now >= DURATION) now = 0;
  playing = true; lastWall = performance.now(); startSound(now); requestAnimationFrame(tick);
}
function pause() { playing = false; stopSound(); show(); }
const seek = t => { now = clamp(t, 0, DURATION); show(); };
let onEnd = () => {};

$('play').onclick = () => (playing ? pause() : play());
$('snd').onclick = () => {
  soundOn = !soundOn; $('snd').textContent = soundOn ? 'sound on' : 'sound off';
  if (playing) startSound(now); else stopSound();
};
$('replay').onclick = () => { now = 0; play(); };
$('scrub').onpointerdown = e => {
  const r = e.currentTarget.getBoundingClientRect();
  const move = ev => seek((ev.clientX - r.left) / r.width * DURATION);
  pause(); move(e);
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', () => window.removeEventListener('pointermove', move), { once: true });
};
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
  if (e.code === 'ArrowRight') { pause(); seek(Math.round(now * FPS + 1) / FPS); }
  if (e.code === 'ArrowLeft') { pause(); seek(Math.round(now * FPS - 1) / FPS); }
});
// Real-time capture for quick previews. The ad upload uses a deterministic frame export.
$('rec').onclick = () => {
  const type = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(stage.captureStream(FPS), { mimeType: type, videoBitsPerSecond: 12e6 });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = 'writersnook-ad.' + (type.startsWith('video/mp4') ? 'mp4' : 'webm');
    a.click();
  };
  onEnd = () => { rec.stop(); onEnd = () => {}; };
  now = 0; rec.start(); play();
};

window.__render = t => { now = t; show(); };
loadFonts().then(async () => {
  // Build the medallion/card bitmaps and warm every code path up front so playback never hitches.
  ARCHIVE.forEach(getCache);
  for (let f = 0; f <= DURATION * 8; f++) render(f / 8);
  $('mp4').onclick = async () => {
    const btn = $('mp4');
    btn.disabled = true;
    try {
      const blob = await exportMp4(p => { btn.textContent = Math.round(p * 100) + '%'; });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'writersnook-ad-1080x1920.mp4'; a.click();
    } catch (e) { alert('Export failed: ' + e.message); }
    btn.textContent = 'mp4'; btn.disabled = false;
  };
  soundtrack = await renderSoundtrack();
  show();
  window.__ready = true;
});
document.title = 'WritersNook Riso Ad';
</script>
